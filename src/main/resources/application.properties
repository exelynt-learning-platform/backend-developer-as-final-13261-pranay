spring.application.name=Resource-Booking-System

spring.datasource.url = jdbc:mysql://localhost:3306/multigenesys-Resource-Booking-System
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false


jwt.secret=${JWT_SECRET}
jwt.access-token-validity=36000000
jwt.refresh-token-validity=604800000


springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
